#
# In collect mode, process_result controls whether command output is checked
# against configured patterns and tests.
collect:
  process_result: false
#
# In repro mode, the commands defined under the commands tag are  used to trigger and detect
# a specific issue. If the issue is triggered, commands defined by
# if_triggered_commands can be collected.
repro:
  #
  # times defines a number of iterations commands is executed.
  times: 1000 
  #
  # interval defines an interval between iterations.
  interval: 60
  #
#
# Defines a command group used  to either collect information as in case of collect mode,
# or to reproduce an issue as in case of repro mode.
commands:
  - command: "ping ipv6 2001:438:fffe::aa1 vrf INTERNET"
    process_result: true
    patterns:
      - pattern_string: '\s*Success rate is\s+[09]{1}[09]?\s+.*'
    debug: false 
