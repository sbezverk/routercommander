# Updated: 2026-10-08 20:54 CEST
# Troubleshoot the affected BVI3318 ACL installation.
#
# The first three stages follow the dependency chain:
#
#   ACL usage -> BVI -> IFH -> filtered extlif object
#
# The internal-TCAM lookup discovers the DB IDs used by
# INGRESS_ACL_L3_IPV4. The physical-interface loop discovers the hosting
# NPU(s), and a keyed join correlates the two collections before the final
# diagshell command is rendered. No NPU or DB ID is hardcoded.
#
# The routercommander location is explicitly set on every command because
# this test is for the fixed 0/0/CPU0 location. Location is deliberately not
# repeated in the command text; ProcessCommand appends it from the YAML
# location field.

pipeline:
  - id: discover_acl_interfaces
    run:
      command: show access-lists ipv4 UE-OUTBOUND-ROAMING-IPV4-IN usage pfilter
      location:
        - 0/0/CPU0

  - id: extract_affected_bvi
    extract:
      from_step_id: discover_acl_interfaces
      record_spec:
        name: affected_bvis
        pattern:
          pattern_string: '^\s*Interface\s*:\s*(?P<bvi>BVI[0-9]+)\s*$'
        where:
          - field: bvi
            equals: BVI3318
        deduplicate_by:
          - bvi

  - id: inspect_affected_bvi
    for_each:
      in: affected_bvis
      steps:
        - id: discover_bvi_ifh
          run:
            command: show im database interface {{.bvi}}
            location:
              - 0/0/CPU0

        - id: extract_bvi_ifh
          extract:
            from_step_id: discover_bvi_ifh
            record_spec:
              name: bvi_ifhs
              pattern:
                pattern_string: '^Interface\s+BVI[0-9]+,\s+ifh\s+(?P<ifh>0x[0-9A-Fa-f]+)\s+\('
              deduplicate_by:
                - ifh

        - id: inspect_bvi_extlif
          for_each:
            in: bvi_ifhs
            outputs:
              - from: extlif_acl_bindings
                into: extlif_acl_bindings_by_bvi
                mode: append
                deduplicate_by:
                  - dpa_ifh
                  - ipv4_acl_id
            steps:
              - id: discover_extlif
                run:
                  # The complete extlif output is collected here. The
                  # extractor below identifies extlif records without relying
                  # on a router-side pipe whose location would be appended by
                  # ProcessCommand.
                  command: show dpa objects extlif
                  location:
                    - 0/0/CPU0

              - id: extract_extlif_acl
                extract:
                  from_step_id: discover_extlif
                  context:
                    - pattern:
                        pattern_string: '^\s*@dpa_intf_t ifh => (?P<dpa_ifh>0x[0-9A-Fa-f]+)\s*$'
                  record_spec:
                    name: extlif_acl_bindings
                    pattern:
                      pattern_string: '^\s*uint16_t ipv4_acl_id => (?P<ipv4_acl_id>[0-9]+)\s*$'
                    inherit:
                      - dpa_ifh
                    deduplicate_by:
                      - dpa_ifh
                      - ipv4_acl_id
      outputs:
        - from: extlif_acl_bindings_by_bvi
          into: extlif_acl_bindings
          mode: append
          deduplicate_by:
            - dpa_ifh
            - ipv4_acl_id

  # Discover the hosting NPUs dynamically:
  #
  #   BVI3318 -> Bundle-Ether41 -> physical members -> hosting NPU
  #
  # Bundle membership is extracted directly from each interface line. This
  # intentionally discovers both Bundle-Ether41.3318 and
  # Bundle-Ether99.3318 when both are attached to BVI3318.
  - id: discover_bvi_l2vpn
    run:
      command: show run l2vpn
      location:
        - 0/0/CPU0

  - id: extract_bvi_bundles
    extract:
      from_step_id: discover_bvi_l2vpn
      record_spec:
        name: bvi_bundles
        pattern:
          pattern_string: '^\s*interface Bundle-Ether(?P<bundle_id>[0-9]+)\.(?P<bvi_id>[0-9]+)\s*$'
        where:
          - field: bvi_id
            equals: '3318'
        deduplicate_by:
          - bvi_id
          - bundle_id

  - id: inspect_bvi_bundles
    for_each:
      in: bvi_bundles
      outputs:
        - from: hosting_npus_by_bundle
          into: hosting_npus
          mode: append
          deduplicate_by:
            - npu
      steps:
        - id: inspect_bvi_bundle
          run:
            command: sh int bundle-ether {{.bundle_id}}
            location:
              - 0/0/CPU0

        - id: extract_physical_interfaces
          extract:
            from_step_id: inspect_bvi_bundle
            record_spec:
              name: physical_interfaces
              pattern:
                pattern_string: '^\s*(?P<interface>TenGigE[0-9/]+)\s+Full-duplex\s+[0-9]+Mb/s\s+(?P<state>Active|Standby)\s*$'
              deduplicate_by:
                - interface

        - id: inspect_physical_interfaces
          for_each:
            in: physical_interfaces
            outputs:
              - from: hosting_npus
                into: hosting_npus_by_bundle
                mode: append
                deduplicate_by:
                  - npu
            steps:
              - id: discover_hosting_npu
                run:
                  command: sh controllers npu voq-usage interface {{.interface}} instance all
                  location:
                    - 0/0/CPU0

              - id: extract_hosting_npus
                extract:
                  from_step_id: discover_hosting_npu
                  record_spec:
                    name: hosting_npus
                    pattern:
                      pattern_string: '^\s*\S+\s+\S+\s+(?P<npu>[0-9]+)\s+[0-9]+\s+[0-9]+\s+[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s+\S+\s*$'
                    deduplicate_by:
                      - npu

  - id: discover_internal_tcam
    run:
      command: show controllers npu internaltcam
      location:
        - 0/0/CPU0

  - id: extract_ingress_acl_db
    extract:
      from_step_id: discover_internal_tcam
      record_spec:
        name: ingress_acl_databases
        pattern:
          pattern_string: '^\s*(?P<npu>[0-9]+)\s+4\s+160b\s+pmf-0\s+[0-9]+\s+[0-9]+\s+(?P<db_id>[0-9]+)\s+INGRESS_ACL_L3_IPV4\s*$'
        deduplicate_by:
          - npu
          - db_id

  - id: correlate_fia_targets
    join:
      left: hosting_npus
      right: ingress_acl_databases
      on:
        - npu
      output: fia_targets
      unmatched: error

  - id: inspect_fia_acl_table
    for_each:
      in: fia_targets
      steps:
        - id: inspect_fia_db
          run:
            command: 'show controllers fia diagshell {{.npu}} "diag field T db={{.db_id}}"'
            location:
              - 0/0/CPU0

  # These two commands were requested by the ACL development team. They do
  # not depend on a particular DB-ID, but they must run once per discovered
  # hosting NPU. Command times/interval repeats each command five times with
  # a two-second interval for that NPU.
  - id: inspect_fia_irpp_signature_block
    for_each:
      in: hosting_npus
      steps:
        - id: inspect_fia_irpp_signature_block_command
          run:
            command: 'show controllers fia diagshell {{.npu}} "diag pp sig block=irpp"'
            times: 5
            interval: 2
            location:
              - 0/0/CPU0

  - id: inspect_fia_last_field
    for_each:
      in: hosting_npus
      steps:
        - id: inspect_fia_last_field_command
          run:
            command: 'show controllers fia diagshell {{.npu}} "diag field last"'
            times: 5
            interval: 2
            location:
              - 0/0/CPU0
