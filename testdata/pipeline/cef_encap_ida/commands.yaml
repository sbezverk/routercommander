# Consolidated FIB-ENCAP-IDA / PATHLIST investigation workflow.
#
# The workflow screens every router first. It then follows every unresolved
# prefix and next hop discovered by `show cef vrf all unresolved`. The
# encap-ID-specific evidence is an additional optional branch: it runs only
# when `show cef encap-id conflict` produces a non-zero conflict record. All
# command output remains attached to its Run step; Extract steps additionally
# produce structured records for later rendering and correlation.
#
# Deliberate workarounds for the current pipeline implementation:
#
# 1. There is no cross-collection join or boolean OR gate yet. Unresolved
#    prefix/next-hop evidence is therefore its own first branch. The
#    encap-ID-specific branch is gated by `encap_conflicts`; retry-db evidence
#    is collected as an independent screen but cannot activate that branch.
#    A future global correlation/branch feature should correlate unresolved
#    records, retry-db PATHLISTs, and encap conflicts explicitly.
#
# 2. The current schema has no scalar/global export pool. Stage 2 therefore
#    runs inside nested `for_each` scopes, where encap IDs, VRFs, prefixes, and
#    PATHLIST records are available as current-record fields.
#
# 3. The detail output is collected for both Conflict and NonConflict
#    PATHLIST records. The current schema cannot pair a conflict object with a
#    separately selected non-conflict object, so the four prefix evidence
#    commands run for every displayed first dependent. This intentionally
#    over-collects evidence rather than silently losing the comparison.
#
# 4. The affected examples are IPv4. IPv6 syntax is not inferred dynamically
#    yet; add a parallel IPv6 command loop when an IPv6 incident is observed.
#
# 5. Independent Stage 2 command loops are used so a command failure in one
#    evidence family does not suppress the other families. `continue_record`
#    is meaningful inside these for_each scopes. A zero-result Run still has
#    the existing pipeline-wide stop semantics, so a command returning no
#    result entries can end collection for the current router.
#
# 6. No unsupported BGP configuration command is invented here. Successful
#    BGP/RIB/CEF outputs are retained in their StepResults. The current
#    continue_record path reports a command failure only through pipeline
#    control flow; it does not persist a separate error record. Add error
#    records in the runtime when the collection format is extended. Add the
#    platform-approved scoped configuration command once its exact syntax is
#    confirmed.

pipeline_limits:
  max_depth: 8
  max_commands: 5000

pipeline:
  # -------------------------------------------------------------------------
  # Stage 1: independent screening commands.
  # -------------------------------------------------------------------------
  - id: stage1_show_clock
    run:
      command: show clock

  - id: stage1_show_version
    run:
      command: show version

  - id: stage1_unresolved
    run:
      command: show cef vrf all unresolved
      location:
        - all

  # A non-impacted router may return the successful text "No prefixes found."
  # The command result is retained and this extraction simply creates an empty
  # collection. The VRF and prefix contexts cover continuation rows.
  - id: extract_unresolved_prefixes
    extract:
      from_step_id: stage1_unresolved
      context:
        - pattern:
            pattern_string: '^VRF:\s+(?P<vrf>[A-Za-z0-9_.:-]+)\s*$'
      record_spec:
        name: unresolved_prefixes
        pattern:
          pattern_string: '^\s*(?P<prefix>[0-9A-Fa-f:.]+/\d+)\s+[0-9A-Fa-f:.]+/\d+\s+\(\?\)(?:<[^>]+>)?\s*$'
        inherit:
          - vrf
        deduplicate_by:
          - vrf
          - prefix

  # Parse the same command result a second time so continuation rows are
  # associated with the prefix that precedes them. This collection drives
  # next-hop detail and local-label evidence below.
  - id: extract_unresolved_next_hops
    extract:
      from_step_id: stage1_unresolved
      context:
        - pattern:
            pattern_string: '^VRF:\s+(?P<next_hop_vrf>[A-Za-z0-9_.:-]+)\s*$'
        - pattern:
            pattern_string: '^\s*(?P<next_hop_prefix>[0-9A-Fa-f:.]+/\d+)\s+[0-9A-Fa-f:.]+/\d+\s+\(\?\)(?:<[^>]+>)?\s*$'
      record_spec:
        name: unresolved_next_hops
        pattern:
          pattern_string: '^\s*(?:[0-9A-Fa-f:.]+/\d+\s+)?(?P<next_hop>[0-9A-Fa-f:.]+/\d+)\s+\(\?\)(?:<[^>]+>)?\s*$'
        inherit:
          - next_hop_vrf
          - next_hop_prefix
        deduplicate_by:
          - next_hop_vrf
          - next_hop

  # First collect evidence directly derived from every unresolved prefix.
  # These commands intentionally precede retry-db and encap-ID processing.
  - id: collect_unresolved_prefix_evidence
    on_error: continue_record
    for_each:
      in: unresolved_prefixes
      steps:
        - id: inspect_unresolved_prefix
          run:
            command: show cef vrf {{.vrf}} {{.prefix}} detail
          on_error: continue_record

  - id: collect_unresolved_next_hop_evidence
    on_error: continue_record
    for_each:
      in: unresolved_next_hops
      steps:
        - id: inspect_unresolved_next_hop
          run:
            command: show cef {{.next_hop}} detail
          on_error: continue_record

        - id: extract_unresolved_local_labels
          extract:
            from_step_id: inspect_unresolved_next_hop
            record_spec:
              name: unresolved_local_labels
              pattern:
                pattern_string: '^\s*local label\s+(?P<local_label>\d+)\s+labels imposed\s+\{[^}]+\}\s*$'
              deduplicate_by:
                - local_label

        - id: collect_unresolved_mpls_label_evidence
          on_error: continue_record
          for_each:
            in: unresolved_local_labels
            steps:
              - id: inspect_unresolved_mpls_label
                run:
                  command: show mpls forwarding labels {{.local_label}} {{.local_label}} detail
                on_error: continue_record

  # Run encap-ID screening only after all evidence derived from unresolved
  # prefixes and next hops has been collected.
  - id: stage1_encap_id_summary
    run:
      command: show cef encap-id summary
      location:
        - all

  - id: stage1_retry_db
    run:
      command: show cef vrf all retry-db
      location:
        - all

  # IOS XR can emit retry-db blocks whose optional error metadata is absent or
  # formatted differently. Do not make the prefix record depend on that
  # metadata: a missing context value would abort the whole router pipeline.
  # The complete raw retry-db output remains in stage1_retry_db. This minimal
  # extraction is only a safe inventory of displayed dependent prefixes; exact
  # error-code classification remains a follow-up parser improvement.
  - id: extract_retry_db_pathlists
    extract:
      from_step_id: stage1_retry_db
      record_spec:
        name: retry_db_pathlists
        pattern:
          pattern_string: '^\s*1st prefix dependent:\s+(?P<retry_vrf>[A-Za-z0-9_.:-]+)\s+(?P<retry_vrfid>0x[0-9A-Fa-f]+)\s+(?P<retry_prefix>[0-9A-Fa-f:.]+/\d+)\s+leaf:(?P<retry_leaf>0x[0-9A-Fa-f]+)\s*$'
        deduplicate_by:
          - retry_vrf
          - retry_prefix
          - retry_leaf

  # This command gates only the optional encap-ID branch below. It is
  # intentionally after unresolved-prefix evidence because an unaffected or
  # differently affected router can produce zero result entries for it, and
  # zero-result processing currently stops the router pipeline.
  - id: stage1_encap_id_conflict
    run:
      command: show cef encap-id conflict
      location:
        - all

  - id: extract_encap_conflicts
    extract:
      from_step_id: stage1_encap_id_conflict
      context:
        - pattern:
            pattern_string: '^Encap id:\s*(?P<encap_id>0x[0-9A-Fa-f]+)\s*$'
        - pattern:
            pattern_string: '^\s*Object ID:\s*(?P<object_id>0x[0-9A-Fa-f]+)(?:,\s*PD Meta Data:\s*(?P<pd_meta_data>[0-9]+))?\s*$'
      record_spec:
        name: encap_conflicts
        pattern:
          pattern_string: '^\s*Number of dependents \(conflict/nonconflict\):\s+(?P<conflict_count>[0-9]+)/(?P<nonconflict_count>[0-9]+)\s*$'
        inherit:
          - encap_id
          - object_id
          - pd_meta_data
        where:
          - field: conflict_count
            not_equals: '0'
        deduplicate_by:
          - encap_id
          - conflict_count
          - nonconflict_count

  # Retain the first non-conflicting pointer as Stage 1 structured evidence.
  # The consolidated Stage 2 pathlist loop also extracts all displayed
  # Conflict/NonConflict dependents from the detail command.
  - id: extract_encap_nonconflict_pathlists
    extract:
      from_step_id: stage1_encap_id_conflict
      context:
        - pattern:
            pattern_string: '^Encap id:\s*(?P<encap_id>0x[0-9A-Fa-f]+)\s*$'
        - pattern:
            pattern_string: '^\s*Object ID:\s*(?P<object_id>0x[0-9A-Fa-f]+)(?:,\s*PD Meta Data:\s*(?P<pd_meta_data>[0-9]+))?\s*$'
      record_spec:
        name: encap_nonconflict_pathlists
        pattern:
          pattern_string: '^\s*First non conflict dependent:\s+type\(PATHLIST\),\s+ptr\s+(?P<nonconflict_pathlist_ptr>0x[0-9A-Fa-f]+)\s*$'
        inherit:
          - encap_id
          - object_id
          - pd_meta_data
        deduplicate_by:
          - encap_id
          - nonconflict_pathlist_ptr

  # -------------------------------------------------------------------------
  # Stage 2: trace evidence. This is a separate loop so trace failure does
  # not suppress the encap detail and prefix evidence loops below.
  # -------------------------------------------------------------------------
  - id: stage2_trace_per_conflict
    on_error: continue_record
    for_each:
      in: encap_conflicts
      steps:
        - id: stage2_trace
          run:
            command: show cef trace
            pipe_modifier: 'include "PATHLIST conflict|path_info_init"'
            location:
              - all
          on_error: continue_record

  # -------------------------------------------------------------------------
  # Stage 2: encap detail and all dependent prefix evidence.
  # -------------------------------------------------------------------------
  - id: stage2_collect_encap_detail
    on_error: continue_record
    for_each:
      in: encap_conflicts
      steps:
        - id: stage2_encap_id_detail
          run:
            command: show cef encap-id {{.encap_id}} detail
            location:
              - all
          on_error: continue_record

        - id: extract_encap_detail_pathlists
          extract:
            from_step_id: stage2_encap_id_detail
            context:
              - pattern:
                  pattern_string: '^Encap id:\s*(?P<detail_encap_id>0x[0-9A-Fa-f]+)\s*$'
              - pattern:
                  pattern_string: '^\s*(?P<pathlist_class>Conflict|NonConflict) objects:\s*$'
              - pattern:
                  pattern_string: '^\s*PATHLIST\s+pl:(?P<detail_pathlist_ptr>0x[0-9A-Fa-f]+)\s+paths:(?P<detail_paths>[0-9]+)\s+pl-type:(?P<detail_pl_type>\S+)\s+refcnt:(?P<detail_refcnt>[0-9]+)(?:\s+retry reason:(?P<detail_retry_reason>\S+))?\s*$'
            record_spec:
              name: encap_detail_pathlists
              pattern:
                pattern_string: '^\s*1st prefix dependent:\s+(?P<detail_vrf>[A-Za-z0-9_.:-]+)\s+(?P<detail_vrfid>0x[0-9A-Fa-f]+)\s+(?P<detail_prefix>[0-9A-Fa-f:.]+/\d+)\s+leaf:(?P<detail_leaf>0x[0-9A-Fa-f]+)\s*$'
              inherit:
                - detail_encap_id
                - pathlist_class
                - detail_pathlist_ptr
                - detail_paths
                - detail_pl_type
                - detail_refcnt
                - detail_retry_reason
              deduplicate_by:
                - pathlist_class
                - detail_pathlist_ptr
                - detail_vrf
                - detail_prefix

        - id: extract_encap_detail_object
          extract:
            from_step_id: stage2_encap_id_detail
            context:
              - pattern:
                  pattern_string: '^Encap id:\s*(?P<object_encap_id>0x[0-9A-Fa-f]+)\s*$'
              - pattern:
                  pattern_string: '^\s*ptr:\s+(?P<encap_object_ptr>0x[0-9A-Fa-f]+)\s*$'
              - pattern:
                  pattern_string: '^\s*obj type:\s+(?P<encap_object_type>[A-Z0-9_]+),\s+flags:\s+(?P<encap_flags>0x[0-9A-Fa-f]+),\s+refcnt:\s+(?P<encap_refcnt>[0-9]+)\s*$'
            record_spec:
              name: encap_detail_objects
              pattern:
                pattern_string: '^\s*update time\s+(?P<encap_update_time>.+?)\s*$'
              inherit:
                - object_encap_id
                - encap_object_ptr
                - encap_object_type
                - encap_flags
                - encap_refcnt
              deduplicate_by:
                - object_encap_id
                - encap_object_ptr

        # Each evidence family has its own loop. With the current error model,
        # a failed Run skips only its current PATHLIST record, then the loop
        # continues and the following family still executes.
        - id: stage2_collect_bgp
          on_error: continue_record
          for_each:
            in: encap_detail_pathlists
            steps:
              - id: stage2_bgp_detail
                run:
                  command: show bgp vrf {{.detail_vrf}} ipv4 unicast {{.detail_prefix}} detail
                  location:
                    - all
                on_error: continue_record

              - id: extract_stage2_bgp_paths
                extract:
                  from_step_id: stage2_bgp_detail
                  context:
                    - pattern:
                        pattern_string: '^BGP routing table entry for (?P<bgp_route_prefix>[0-9A-Fa-f:.]+/\d+), Route Distinguisher: (?P<bgp_route_rd>\S+)\s*$'
                    - pattern:
                        pattern_string: '^\s*Path #(?P<bgp_path_number>[0-9]+):.*$'
                    - pattern:
                        pattern_string: '^\s*Flags:\s+(?P<path_flags>[^,]+),\s+import:\s+(?P<import_flags>0x[0-9A-Fa-f]+)\s*$'
                    - pattern:
                        pattern_string: '^\s*(?P<bgp_next_hop>[0-9A-Fa-f:.]+)\s+\(metric\s+(?P<bgp_metric>[0-9]+)\)\s+from\s+(?P<peer_address>[0-9A-Fa-f:.]+)\s+\((?P<peer_router_id>[0-9A-Fa-f:.]+)\),\s+if-handle\s+(?P<if_handle>0x[0-9A-Fa-f]+)\s*$'
                    - pattern:
                        pattern_string: '^\s*Received Label\s+(?P<received_label>[0-9]+)\s*$'
                    - pattern:
                        pattern_string: '^\s*(?P<path_attributes>Origin\s+.+)\s*$'
                    - pattern:
                        pattern_string: '^\s*Received Path ID\s+(?P<received_path_id>[0-9]+),\s+Local Path ID\s+(?P<local_path_id>[0-9]+),\s+version\s+(?P<path_version>[0-9]+)\s*$'
                    - pattern:
                        pattern_string: '^\s*Extended community:\s+(?P<extended_community>.+?)\s*$'
                    - pattern:
                        pattern_string: '^\s*\((?P<link_bandwidth_detail>LB non-transitive AS:bytes/sec:(?P<link_bandwidth_as>[0-9]+):(?P<link_bandwidth_bytes_per_sec>[0-9.]+))\)\s*$'
                  record_spec:
                    name: stage2_bgp_paths
                    pattern:
                      pattern_string: '^\s*Source AFI:\s+(?P<source_afi>[^,]+),\s+Source VRF:\s+(?P<source_vrf>[^,]+),\s+Source Route Distinguisher:\s+(?P<source_rd>\S+)\s*$'
                    inherit:
                      - bgp_route_prefix
                      - bgp_route_rd
                      - bgp_path_number
                      - path_flags
                      - import_flags
                      - bgp_next_hop
                      - bgp_metric
                      - peer_address
                      - peer_router_id
                      - if_handle
                      - received_label
                      - path_attributes
                      - received_path_id
                      - local_path_id
                      - path_version
                      - extended_community
                      - link_bandwidth_detail
                      - link_bandwidth_as
                      - link_bandwidth_bytes_per_sec
                    deduplicate_by:
                      - bgp_path_number
                      - bgp_next_hop
                      - source_vrf
                      - source_rd

        - id: stage2_collect_route_detail
          on_error: continue_record
          for_each:
            in: encap_detail_pathlists
            steps:
              - id: stage2_route_detail
                run:
                  command: show route vrf {{.detail_vrf}} ipv4 {{.detail_prefix}} detail
                  location:
                    - all
                on_error: continue_record

        - id: stage2_collect_cef_detail
          on_error: continue_record
          for_each:
            in: encap_detail_pathlists
            steps:
              - id: stage2_cef_detail
                run:
                  command: show cef vrf {{.detail_vrf}} ipv4 {{.detail_prefix}} detail
                  location:
                    - all
                on_error: continue_record

        - id: stage2_collect_cef_internal
          on_error: continue_record
          for_each:
            in: encap_detail_pathlists
            steps:
              - id: stage2_cef_internal
                run:
                  command: show cef vrf {{.detail_vrf}} ipv4 {{.detail_prefix}} internal
                  location:
                    - all
                on_error: continue_record

# The prompt requests relevant BGP VRF address-family configuration, including
# maximum-paths/unequal-cost, label mode, and applied policies. The exact
# supported read-only command was not supplied, so it is intentionally not
# invented here. Add the platform-approved scoped command once confirmed.
