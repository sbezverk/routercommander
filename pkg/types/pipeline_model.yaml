pipeline_limits:
  max_depth: 8
  max_commands: 5000
  max_records: 500

pipeline:
  # Discover unresolved routes.
  - id: discover_ipv4_unresolved
    run:
      command: show cef vrf all ipv4 unresolved
      location:
        - 0/RP0/CPU0
      process_result: true

  # Extract the VRF context and route records from the discovery output.
  - id: extract_ipv4_unresolved
    extract:
      from_step_id: discover_ipv4_unresolved
      context:
        - pattern:
            pattern_string: '^VRF:\s+(?P<vrf>[A-Za-z0-9_.:-]+)\s*$'
      record_spec:
        max_records: 1000
        name: route
        pattern:
          pattern_string: '^\s*(?P<prefix>[0-9A-Fa-f:.]+/\d+)\s+(?P<next_hop>[0-9A-Fa-f:.]+/\d+)'
        inherit:
          - vrf
        deduplicate_by:
          - vrf
          - prefix
          - next_hop

  # Execute dependent commands once for every extracted route.
  - id: inspect_routes
    for_each:
      in: route
      steps:
        - id: inspect_prefix_egress
          run:
            command: show cef vrf {{.vrf}} {{.prefix}} hardware egress detail
            location:
              - all
          on_error: continue_record

        - id: inspect_next_hop_egress
          run:
            command: show cef {{.next_hop}} hardware egress detail
            location:
              - all
          on_error: continue_record

  # Branching within a for_each step, checking variables collected by record spec "route",
  # each branch step has its own ID.
        - id: classify_route
          branch:
            cases:
              - when:
                  field: prefix
                  equals: blah
                steps:
                  - id: run_command_two
                    run:
                      command: show command-two

              - when:
                  field: prefix
                  equals: halb
                steps:
                  - id: run_command_three
                    run:
                      command: show command-three
            default:
              - id: run_default_command
                run:
                  command: show command-default

  # Recursive processing: each level is represented by separate run,
  # extract, and for_each steps.
  - id: level_one_discovery
    run:
      command: show discovery-one

  - id: level_one_extract
    extract:
      from_step_id: level_one_discovery
      record_spec:
        name: first_records
        pattern:
          pattern_string: '^(?P<first_value>\S+)'

  - id: level_one_for_each
    for_each:
      in: first_records
      steps:
        - id: level_two_command
          run:
            command: show discovery-two {{.first_value}}

        - id: level_two_extract
          extract:
            from_step_id: level_two_command
            record_spec:
              name: second_records
              pattern:
                pattern_string: '^(?P<second_value>\S+)'

        - id: level_two_for_each
          for_each:
            in: second_records
            steps:
              - id: level_three_command
                run:
                  command: show discovery-three {{.second_value}}

              - id: level_three_extract
                extract:
                  from_step_id: level_three_command
                  record_spec:
                    name: third_records
                    pattern:
                      pattern_string: '^(?P<third_value>\S+)'

              - id: level_three_for_each
                for_each:
                  in: third_records
                  steps:
                    - id: level_four_command
                      run:
                        command: show detail {{.third_value}}

# ---------------------------------------------------------------------------
# Proposed Phase 5A examples: export and keyed join
# ---------------------------------------------------------------------------
#
# The following examples are intentionally commented out. The current
# PipelineStep model supports run, extract, for_each, and branch. Export and
# join are documented future operations from Phase 5A and are shown here for
# visual reference without making this parser fixture invalid before those
# operations are implemented.
#
# Both operations are pipeline-level transformations and must not be placed
# inside a for_each block. They do not connect to a router and do not produce
# StepResults; they transform data already collected in RunContext.

# Example 1: publish one uniquely discovered value as a pipeline variable.
#
# Expected discovery output:
#
#   Hosting NPU: 0
#
# The `exactly_one` policy prevents an ambiguous result from silently using
# the last record found.
#
# pipeline:
#   - id: discover_hosting_npu
#     run:
#       command: show controller npu voq-usage interface TenGigE0/0/0/3/0
#       location:
#         - 0/0/CPU0
#
#   - id: extract_hosting_npu
#     extract:
#       from_step_id: discover_hosting_npu
#       record_spec:
#         name: hosting_npus
#         pattern:
#           pattern_string: '^\s*Hosting NPU:\s*(?P<npu>\d+)\s*$'
#         deduplicate_by:
#           - npu
#
#   - id: publish_hosting_npu
#     export:
#       from: hosting_npus
#       field: npu
#       as: hosting_npu
#       require: exactly_one
#
#   - id: inspect_hosting_npu
#     run:
#       command: show controllers fia diagshell {{.hosting_npu}} "diag field last"
#       location:
#         - 0/0/CPU0

# Example 2: correlate independently discovered NPU and ACL DB-ID records.
#
# The two source collections are joined by the shared `npu` key. The join
# creates fresh records such as:
#
#   diagnostic_targets:
#     - npu: "0"
#       db_id: "32"
#
# `unmatched: ignore` creates an inner join and reports unmatched values in
# diagnostics. A future stricter profile could select `unmatched: error`.
#
# pipeline:
#   - id: discover_hosting_npus
#     run:
#       command: show controller npu voq-usage interface TenGigE0/0/0/3/0
#       location:
#         - 0/0/CPU0
#
#   - id: extract_hosting_npus
#     extract:
#       from_step_id: discover_hosting_npus
#       record_spec:
#         name: hosting_npus
#         pattern:
#           pattern_string: '^\s*Interface\s+(?P<interface>\S+)\s+NPU\s+(?P<npu>\d+)\s*$'
#         deduplicate_by:
#           - interface
#           - npu
#
#   - id: discover_acl_db_entries
#     run:
#       command: show controllers npu internaltcam location 0/0/CPU0
#       location:
#         - 0/0/CPU0
#
#   - id: extract_acl_db_entries
#     extract:
#       from_step_id: discover_acl_db_entries
#       record_spec:
#         name: ingress_acl_entries
#         pattern:
#           pattern_string: '^\s*NPU\s+(?P<npu>\d+)\s+INGRESS_ACL_L3_IPV4\s+DB\s+(?P<db_id>\d+)\s*$'
#         deduplicate_by:
#           - npu
#           - db_id
#
#   - id: correlate_fia_targets
#     join:
#       left: hosting_npus
#       right: ingress_acl_entries
#       on:
#         - npu
#       output: diagnostic_targets
#       unmatched: ignore
#
#   - id: inspect_fia_targets
#     for_each:
#       in: diagnostic_targets
#       steps:
#         - id: inspect_fia_db
#           run:
#             command: show controllers fia diagshell {{.npu}} "diag field T db={{.db_id}}"
#             location:
#               - 0/0/CPU0

# Scope reminder:
# - export and join are not valid inside `for_each` in the initial design;
# - collections created inside a for_each are child-local;
# - an explicit collection-aggregation operation will be required if a
#   later pipeline-level join must consume records created inside a loop; and
# - automatic promotion of every extracted field into Variables is forbidden.
