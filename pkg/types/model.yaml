repro:
  times: 1
  interval: 60
  if_triggered_commands:
    - command: 'repro test command'            
      command_timeout: 2
      times: 1
      interval: 1
      wait_before: 1
      wait_after: 1
      location:
      - 0/0/CPU0
      debug: false
      process_result: false
      patterns: 
        - pattern_string: 'test'
      command_test_ids: [0]
  stop_when_triggered: false
collect:
  process_result: true
tests:
  - command: 'show cef drop'
    command_tests:
    - id: 1
      pattern:
        pattern_string: '((:?\w+\s)+)(drops\s+)(packets\s+:)\s+[1-9]\d*\n'
      occurrence:
      number_of_occurrences:
      fields:
      - field_number: 1
        operation: "field operation 1"
        value: "1"
      - field_number: 2
        operation: "field operation 2"
        value: "2"
      separator:
      if_triggered_commands:
      - command: 'test if triggered command'            
        command_timeout: 2
        times: 1
        interval: 1
        wait_before: 1
        wait_after: 1
        location:
        - 0/0/CPU0
        debug: false
        process_result: false
        patterns: 
          - pattern_string: 'test'
        command_test_ids: [0]
      check_all_results: false
commands:
  - command: 'show cef drop'
    patterns:
    - pattern_string: '((:?\w+\s)+)(drops\s+)(packets\s+:)\s+[1-9]\d*\n'
    command_test_ids: [1]
    command_timeout: 2
    times: 1
    interval: 1
    wait_before: 1
    wait_after: 1
    location:
     - 0/0/CPU0
    debug: false
    process_result: false
# Pipeline configuration for automated command execution and result extraction
pipeline_limits:
  max_depth: 8
  max_commands: 5000
pipeline:
  - id: discover_ipv4_unresolved
    run:
      command: show cef vrf all ipv4 unresolved
      location:
        - 0/RP0/CPU0
      process_result: true

    extract:
      context:
        - pattern: '^VRF:\s+(?P<vrf>[A-Za-z0-9_.:-]+)\s*$'

      records:
        name: route
        pattern: '^\s*(?P<prefix>[0-9A-Fa-f:.]+/\d+)\s+(?P<next_hop>[0-9A-Fa-f:.]+/\d+)'
        inherit:
          - vrf
        deduplicate_by:
          - vrf
          - prefix
          - next_hop

    for_each:
      in: route
      steps:
        - id: inspect_prefix_egress
          run:
            command: show cef vrf {{.vrf}} {{.prefix}} hardware egress detail
            location:
              - all
          on_error: continue_record

        - id: inspect_next_hop_egress
          run:
            command: show cef {{.next_hop}} hardware egress detail
            location:
              - all
          on_error: continue_record
# Branching logic for executing commands based on field values
  - id: classify_route
    branch:
      cases:
        - when:
            field: field_1
            equals: blah
          then:
            - run:
                command: show command-two

        - when:
            field: field_1
            equals: halb
          then:
            - run:
                command: show command-three
      default:
        - run:
            command: show command-default
# recursive commands execution when parent command provides values used to render a child command
  - id: level_one_discovery
    run:
      command: show discovery-one
    extract:
      records:
        name: first_records
        pattern: '^(?P<first_value>\S+)'
    for_each:
      in: first_records
      steps:
        - id: level_two_command
          run:
            command: show discovery-two {{.first_value}}
          extract:
            records:
              name: second_records
              pattern: '^(?P<second_value>\S+)'
          for_each:
            in: second_records
            steps:
              - id: level_three_command
                run:
                  command: show discovery-three {{.second_value}}
                extract:
                  records:
                    name: third_records
                    pattern: '^(?P<third_value>\S+)'
                for_each:
                  in: third_records
                  steps:
                    - id: level_four_command
                      run:
                        command: show detail {{.third_value}}
